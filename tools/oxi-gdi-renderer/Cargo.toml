[package]
name = "oxi-gdi-renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
oxidocs-core = { path = "../../crates/oxidocs-core" }
serde_json = "1"
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Investigation builds (instrumented probes, A/B of a single doc): incremental,
# low optimisation. Layout numbers are identical to release (no fast-math in
# Rust); gates and snapshots still use --release.
[profile.fast]
inherits = "release"
opt-level = 1
incremental = true
codegen-units = 256

# Instrumented single-document probes only (slow binary, fastest rebuild).
[profile.probe]
inherits = "dev"
opt-level = 0
incremental = true
debug = false
